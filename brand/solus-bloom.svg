<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SOLUS">
  <!-- Luminous cut: for the X avatar and hero surfaces. Ships with its own black ground. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#eaf0ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9fb4d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9fb4d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="soften-far" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05060a"/>

  <!-- Expanding shells, each fainter than the last. -->
  <circle cx="256" cy="256" r="228" stroke="#8fa6c8" stroke-width="1.4" fill="none" opacity="0.07" filter="url(#soften-far)"/>
  <circle cx="256" cy="256" r="168" stroke="#9fb4d8" stroke-width="1.4" fill="none" opacity="0.13" filter="url(#soften-far)"/>
  <circle cx="256" cy="256" r="104" stroke="#cfdcf2" stroke-width="1.5" fill="none" opacity="0.28" filter="url(#soften)"/>

  <!-- The point itself. -->
  <circle cx="256" cy="256" r="96" fill="url(#core)"/>
  <circle cx="256" cy="256" r="4.5" fill="#ffffff"/>
</svg>
